<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>BROCHEST Portal</title>
    <script>
      // SPA fallback: when a route 404s, redirect to the base with hash
      // This ensures React Router picks up the path
      (function(loc) {
        var target = loc.origin + '/#' + loc.pathname + loc.search + loc.hash;
        loc.replace(target);
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
